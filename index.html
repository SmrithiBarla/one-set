 app.innerHTML='<p class="sub">Connecting to your cloud history…</p>';try{await loadRemote();view='home';render();}catch(e){err=e.message;app.innerHTML=`<section class="authPanel"><div class="eyebrow">COULD NOT LOAD HISTORY</div><h1 class="big">Not yet connected.</h1><div class="errBox">${esc(err)}</div><p>We will not show an empty workout history when the cloud could not be reached.</p><button type="button" id="retry" class="primary">Retry connection</button><button type="button" id="logout" class="smallLink">Sign in again</button></section>`;app.querySelector('#retry').onclick=start;app.querySelector('#logout').onclick=async()=>{await forgetAuth();view='auth';render();};}}
menu.onclick=()=>{if(view==='tools'){view=backView==='workout'&&findActive()?'workout':'home';err='';}else{backView=view==='workout'?'workout':'home';view='tools';}render();window.scrollTo(0,0);};
window.addEventListener('online',()=>{if(view==='home'||view==='tools')err='';});
