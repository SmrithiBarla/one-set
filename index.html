function loginDB(op,value){return new Promise(resolve=>{

 const done=v=>{if(finished)return;finished=true;try{db?.close();}catch(_){}resolve(v);};

function headers(token){return {'apikey':config.key,'Authorization':'Bearer '+token,'Content-Type':'application/json'};}
async function raw(url,opts={}){let resp;try{resp=await fetch(url,opts);}catch(_){throw new Error('No connection to the cloud. The set has NOT been saved.');}let data=null;const text=await resp.text();if(text){try{data=JSON.parse(text);}catch(_){data=text;}}if(!resp.ok){const detail=data?.msg||data?.message||data?.error_description||data?.error||('Cloud returned '+resp.status);throw new Error('HTTP '+resp.status+': '+String(detail));}return data;}
async function refreshAuth(){if(!auth?.refresh_token)throw new Error('Session expired. Please sign in again.');const result=await raw(config.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':config.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:auth.refresh_token})});if(!result.access_token)throw new Error('Could not refresh login.');auth={...auth,...result,expires_at:Date.now()+(result.expires_in||3600)*1000,user:result.user||auth.user};await rememberAuth();return auth.access_token;}
async function getToken(){if(!auth?.access_token)throw new Error('Please sign in again.');if((auth.expires_at||0)<Date.now()+90000)await refreshAuth();return auth.access_token;}
async function api(path,options={}){let token=await getToken();let last;for(let attempt=0;attempt<2;attempt++){
 try{return await raw(config.url+'/rest/v1/'+path,{...options,headers:{...headers(token),'Prefer':'return=representation',...(options.headers||{})}});}catch(e){last=e;if(attempt===0&&/jwt|401|token expired|invalid token/i.test(e.message)){token=await refreshAuth();continue;}break;}}
 throw last;}
function fromRow(r){return {id:r.id,dayId:r.day_id,startedAt:r.started_at,finishedAt:r.finished_at,status:r.status,index:r.exercise_index,logs:r.logs||{},extraSets:r.extra_sets||{},snapshot:r.plan_snapshot||null,revision:r.revision||1};}
function toRow(s){return {id:s.id,user_id:auth.user.id,day_id:s.dayId,started_at:s.startedAt,finished_at:s.finishedAt||null,status:s.status,exercise_index:s.index,logs:s.logs,extra_sets:s.extraSets||{},plan_snapshot:s.snapshot||null,revision:s.revision,updated_at:new Date().toISOString()};}
function setCache(){store(CACHE_KEY,{userId:auth?.user?.id,sessions,at:new Date().toISOString()});}
async function loadPlan(){
 const rows=await api('oneset_plans?select=*&limit=1',{method:'GET'});
 if(!Array.isArray(rows))throw new Error('Could not load your personal routines.');
 if(rows.length===0){
  // Each new account starts with an independent cloud copy of the original four workouts.
  await api('oneset_plans?on_conflict=user_id',{method:'POST',headers:{'Prefer':'resolution=ignore-duplicates,return=representation'},body:JSON.stringify({user_id:auth.user.id,routines:starterRoutines(),revision:1})});
  const retry=await api('oneset_plans?select=*&limit=1',{method:'GET'});
  if(retry.length!==1)throw new Error('Cloud did not confirm creation of your starter workouts.');
  routines=retry[0].routines;planRevision=retry[0].revision;
 }else{routines=rows[0].routines;planRevision=rows[0].revision;}
 if(!validRoutines(routines))throw new Error('Your stored routine data needs attention; no changes were made.');
}
async function savePlan(next){
 if(!validRoutines(next))throw new Error('Every routine needs a name and at least one valid exercise.');
 const revision=planRevision;
 const result=await api('oneset_plans?user_id=eq.'+encodeURIComponent(auth.user.id)+'&revision=eq.'+revision,{method:'PATCH',body:JSON.stringify({routines:next,revision:revision+1,updated_at:new Date().toISOString()})});
 if(!Array.isArray(result)||result.length!==1)throw new Error('Your routines changed on another device. Reload the page before editing again.');
 routines=clone(result[0].routines);planRevision=result[0].revision;
}
async function loadRemote(){const rows=await api('oneset_sessions?select=*&order=started_at.desc&limit=10000',{method:'GET'});if(!Array.isArray(rows))throw new Error('Unexpected response from cloud storage.');sessions=rows.map(fromRow);activeId=[...sessions].filter(s=>s.status==='active').sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt))[0]?.id||null;setCache();}
async function createRemote(s){const result=await api('oneset_sessions',{method:'POST',body:JSON.stringify(toRow(s))});if(!Array.isArray(result)||result.length!==1)throw new Error('Cloud did not confirm the new session.');return fromRow(result[0]);}
async function updateRemote(s){const updated={...s,revision:s.revision+1};const id=encodeURIComponent(s.id),rev=encodeURIComponent(s.revision);const result=await api('oneset_sessions?id=eq.'+id+'&revision=eq.'+rev,{method:'PATCH',body:JSON.stringify(toRow(updated))});if(!Array.isArray(result)||result.length!==1)throw new Error('Your session changed elsewhere. Reload cloud history before making changes.');return fromRow(result[0]);}
async function deleteRemote(s){const result=await api('oneset_sessions?id=eq.'+encodeURIComponent(s.id)+'&revision=eq.'+encodeURIComponent(s.revision),{method:'DELETE'});if(!Array.isArray(result)||result.length!==1)throw new Error('Delete was not confirmed. Reload history.');}
async function transact(task){if(busy)return false;setBusy(true);err='';try{await task();setCache();setBusy(false);render();return true;}catch(e){setBusy(false);markError(e.message);return false;}}
async function editCurrent(update){const s=findActive();if(!s)return false;return transact(async()=>{const next=clone(s);update(next);const stored=await updateRemote(next===s?next:{...next,revision:s.revision});sessions=sessions.map(x=>x.id===s.id?stored:x);activeId=stored.status==='active'?stored.id:null;});}
function render(){menu.hidden=['setup','auth'].includes(view);menu.textContent=['tools','plans','editPlan'].includes(view)?'Back':'History & backup';
 if(view==='setup')renderSetup();else if(view==='auth')renderAuth();else if(view==='workout'&&findActive())renderWorkout();else if(view==='tools')renderTools();else if(view==='plans')renderPlans();else if(view==='editPlan')renderEditPlan();else if(view==='complete')renderComplete();else renderHome();}
function renderSetup(){app.innerHTML=`<section class="fade authPanel"><div class="eyebrow">ONE-TIME SETUP</div><h1 class="big">Cloud first.<br>No lost sets.</h1><p>We'll store your workouts in a private Supabase account. You'll need to create a free Supabase project and run the provided SQL once.</p><div class="infoBox">Use your <b>project URL</b> and <b>publishable key</b>. Never paste a secret or service-role key.</div><form id="setupForm"><div class="field"><label for="url">Supabase project URL</label><input id="url" type="url" inputmode="url" placeholder="https://project-ref.supabase.co" value="${esc(config?.url||'')}" required><small>Just the project URL, with no /auth/v1, /rest/v1, or other path.</small></div><div class="field"><label for="key">Supabase publishable key</label><input id="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sb_publishable_..." value="${esc(config?.key||'')}" required></div><button class="primary" type="submit" id="connectButton">Test connection & continue →</button></form><p class="minor">Copy both from the SAME Supabase project in Project Settings → API Keys / Connect. To skip setup on future devices, set the public configuration near the top of index.html on GitHub.</p><div id="setupError" role="alert" class="inlineNotice"></div></section>`;
 app.querySelector('#setupForm').onsubmit=async e=>{e.preventDefault();if(busy)return;
   const entered=document.getElementById('url').value.trim(), key=document.getElementById('key').value.trim();
   const button=document.getElementById('connectButton'), message=document.getElementById('setupError');
   try{
     const parsed=new URL(entered);
     if(parsed.protocol!=='https:' || !/^[a-z0-9-]+\.supabase\.co$/.test(parsed.hostname) || parsed.port || parsed.username || parsed.password || !['','/'].includes(parsed.pathname) || parsed.search || parsed.hash){
       throw new Error('Use the project URL only, like https://PROJECT-REF.supabase.co — no /auth/v1, /rest/v1, extra text or dashboard link.');
     }
     if(!(key.startsWith('sb_publishable_')||key.startsWith('eyJ')) || key.startsWith('sb_secret_')){
       throw new Error('Use the publishable key from the same project. Never use a secret or service-role key.');
     }
     busy=true;button.disabled=true;button.textContent='Checking Supabase…';message.textContent='';
     let settings;
     try{settings=await raw(parsed.origin+'/auth/v1/settings',{method:'GET',headers:{'apikey':key}});}
     catch(ex){if(/404/.test(ex.message))throw new Error('Supabase returned 404. Recheck the project URL in your dashboard; this address does not appear to reach an Auth service.');throw new Error('Could not verify Supabase connection: '+ex.message);}
     if(!settings || typeof settings!=='object')throw new Error('Supabase did not return valid authentication settings. Recheck project details.');
     if(settings.disable_signup)throw new Error('Supabase has account creation disabled. Enable email sign-ups in Authentication settings.');
     config={url:parsed.origin,key};store(CONFIG_KEY,config);auth=null;drop(AUTH_KEY);view='auth';notice='Cloud connection checked. You can now create an account.';err='';render();
   }catch(ex){message.textContent=ex.message;}
   finally{busy=false;if(button.isConnected){button.disabled=false;button.textContent='Test connection & continue →';}}
 };
}
function renderAuth(){app.innerHTML=`<section class="fade authPanel"><div class="eyebrow">PRIVATE WORKOUT HISTORY</div><h1 class="big">Sign in.<br>Pick up where you left off.</h1><p>Your workout history lives online under this login. One Set will try to keep you signed in on this device.</p>${notice?`<div class="infoBox">${esc(notice)}</div>`:''}${err?`<div class="errBox">${esc(err)}</div>`:''}<form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters"></div><button id="login" class="primary" type="submit">Sign in</button><div class="buttonRow"><button id="signup" class="secondary" type="button">Create account</button>${!fixedConfig?'<button id="editSetup" class="secondary" type="button">Cloud settings</button>':''}</div></form><p class="minor">New account? Tap Create account. Supabase might ask you to verify your email first.</p></section>`;
 app.querySelector('#loginForm').onsubmit=e=>{e.preventDefault();signIn(false);};app.querySelector('#signup').onclick=()=>signIn(true);app.querySelector('#editSetup')?.addEventListener('click',()=>{view='setup';render();});}
async function signIn(signup){if(busy)return;const email=app.querySelector('#email').value.trim(),password=app.querySelector('#password').value;if(!email||password.length<8){err='Enter a valid email and a password of at least 8 characters.';renderAuth();return;}busy=true;const btn=app.querySelector('#login');btn.disabled=true;btn.textContent='Connecting…';err='';try{
  const path=signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const body={email,password};const reply=await raw(config.url+path,{method:'POST',headers:{'apikey':config.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!reply.access_token){notice='Account request received. Check your email for a confirmation link, then return to One Set and sign in.';view='auth';return;}
  auth={access_token:reply.access_token,refresh_token:reply.refresh_token,expires_at:Date.now()+(reply.expires_in||3600)*1000,user:reply.user};
  if(!auth.user?.id)throw new Error('Login response did not include an account ID.');const remembered=await rememberAuth();await loadPlan();await loadRemote();view='home';if(remembered)notice='';err='';
 }catch(e){err=/404/.test(e.message)?'Supabase returned 404 during account creation. Open Cloud settings and recheck that the project URL and publishable key come from the same project. If they do, check whether the Supabase project is active.':e.message;view='auth';}finally{busy=false;render();}}

 app.innerHTML=`<section class="fade"><div class="eyebrow">YOUR PERSONAL ROUTINE</div><h1 class="big">Show up.<br>Do the next set.</h1><p class="sub">One exercise at a time. Every saved set confirmed by the cloud.</p>${statusBar()}${active?`<div class="resumeBox"><div class="eyebrow">IN PROGRESS</div><strong>${esc(sessionRoutine(active)?.name||'Workout')}</strong><p>${Object.values(active.logs).reduce((n,arr)=>n+(Array.isArray(arr)?arr.length:0),0)} sets saved online</p><button type="button" class="primary" id="resume">Resume workout →</button></div>`:''}<div class="dayGrid">${routines.map(r=>`<button type="button" class="dayCard" data-day="${esc(r.id)}"><b>${esc(r.name)}</b><span>${r.exercises.length} exercises</span></button>`).join('')}</div>${!routines.length?'<div class="infoBox">Your routine list is empty. Add your first workout below.</div>':''}<div class="editToolbar"><span class="footnote">Only your account sees your edits.</span><button type="button" id="manageRoutines" class="secondary">Edit routines ⚙</button></div><p class="footnote">Your workout history stays separate from your routines, even when you edit or delete one.</p></section>`;

async function startWorkout(day){const routine=routineById(day);if(!routine||!routine.exercises.length)return;const old=findActive();if(old?.dayId===day){view='workout';render();return;}
 const hasLogs=old&&Object.values(old.logs).some(a=>Array.isArray(a)&&a.length);
 if(old&&hasLogs&&!confirm(`Switch to ${routine.name}? Logged sets for ${sessionRoutine(old)?.name||'your current workout'} will stay in history as a partial session.`))return;
 const ok=await transact(async()=>{
  if(old&&!hasLogs){const updated=clone(old);updated.dayId=day;updated.snapshot=clone(routine);updated.index=0;updated.logs={};updated.extraSets={};updated.startedAt=new Date().toISOString();const row=await updateRemote(updated);sessions=sessions.map(x=>x.id===old.id?row:x);activeId=row.id;}
  else{
   if(old){const next={...clone(old),status:'partial',finishedAt:new Date().toISOString()};const partial=await updateRemote(next);sessions=sessions.map(x=>x.id===old.id?partial:x);activeId=null;}
   const item={id:newId('session'),dayId:day,snapshot:clone(routine),startedAt:new Date().toISOString(),finishedAt:null,status:'active',index:0,logs:{},extraSets:{},revision:1};
   const row=await createRemote(item);sessions.push(row);activeId=row.id;
  }
 });if(ok){draft=null;view='workout';render();}}

iv>`).join('')}<button class="secondary" id="addExercise" style="width:100%;margin-top:10px">+ Add exercise</button><button class="primary" id="saveRoutine" style="margin-top:20px">Save routine to cloud ✓</button><p class="footnote">No changes are saved until you tap Save routine. An existing in-progress workout isn't changed.</p></section>`;

 ${!complete?`<div class="setPanel"><div class="setTop"><strong>Set ${index+1} / ${total} ${index>=planned?'<small style="color:var(--accent)">Optional</small>':''}</strong><div class="dotRow">${Array.from({length:total},(_,i)=>`<span class="dot ${i<index?'done':i===index?'now':''}"></span>`).join('')}</div></div><form id="setForm">${ex.kind==='body'?`<div class="modeRow">${[['bw','Bodyweight'],['added','+ Weight'],['assisted','Assisted']].map(([val,label])=>`<button type="button" data-mode="${val}" class="pill ${mode===val?'selected':''}">${label}</button>`).join('')}</div>`:''}<div class="fields ${ex.kind==='body'&&mode==='bw'?'onlyInput':''}"><div class="field"><label for="reps">Reps done</label><input id="reps" type="number" inputmode="numeric" min="1" max="300" step="1" placeholder="0" value="${esc(reps)}" required><small>Clean reps only</small></div>${ex.kind!=='body'||mode!=='bw'?`<div class="field"><label for="kg">${ex.kind==='db'?'Kg per dumbbell':ex.kind==='weight'?'Weight (kg)':mode==='added'?'Extra kg added':'Kg assistance (optional)'}</label><input id="kg" type="number" inputmode="decimal" min="0" max="300" step="any" value="${esc(kg)}" placeholder="0" ${mode==='assisted'?'':'required'}><small>${ex.kind==='db'?'If using two DBs, log weight of one':ex.kind==='weight'?'Total weight used':'Enter 0 for band assistance'}</small></div>`:''}</div><button type="submit" id="saveSetButton" class="primary" data-original="Save set ${index+1} ✓">Save set ${index+1} ✓</button><p class="minor" style="text-align:center">Moves to the next set only after cloud confirmation</p></form>${index>=planned?'<button id="cancelExtra" class="smallLink" type="button">Never mind · finish exercise</button>':''}</div>`:`<div class="completeCard"><div class="completeIcon">✓</div><h2>Exercise done.</h2><p>Your sets are saved online. You can move on.</p><button id="nextExercise" class="primary" type="button">${s.index===day.exercises.length-1?'Finish workout':'Next exercise →'}</button>${extraOf(s,ex.id)<MAX_EXTRA?'<div class="extraActions"><button type="button" id="addSet" class="secondary">+ Add an optional set</button></div>':''}</div>`}
 ${sets.length?`<div class="saved"><h3>Cloud saved sets</h3>${sets.map((set,i)=>`<div class="savedRow"><span><span class="num">${i+1}.</span>${esc(fmtSet(set,ex))}</span><span class="tick">✓</span></div>`).join('')}<div style="text-align:right"><button type="button" class="smallLink" id="undo">Undo last set</button></div></div>`:''}${!complete&&index<planned?'<div style="text-align:center"><button type="button" class="smallLink" id="skip">Skip exercise</button></div>':''}</section>`;
 app.querySelector('#allWorkouts').onclick=()=>{view='home';draft=null;err='';render();};app.querySelector('#setForm')?.addEventListener('submit',saveSet);
 app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{draft={mode:b.dataset.mode,reps:app.querySelector('#reps')?.value||'',kg:app.querySelector('#kg')?.value||'0'};render();});
 app.querySelector('#undo')?.addEventListener('click',()=>editCurrent(x=>{const removed=logsOf(x,ex.id).pop();draft=removed?{reps:removed.reps,kg:removed.kg,mode:removed.mode}:null;}));
 app.querySelector('#addSet')?.addEventListener('click',()=>editCurrent(x=>{x.extraSets[ex.id]=extraOf(x,ex.id)+1;}));
 app.querySelector('#cancelExtra')?.addEventListener('click',()=>editCurrent(x=>{x.extraSets[ex.id]=logsOf(x,ex.id).length-ex.sets;}));
 app.querySelector('#nextExercise')?.addEventListener('click',advance);
 app.querySelector('#skip')?.addEventListener('click',()=>{if(confirm('Skip this exercise?'))advance();});
}
async function saveSet(event){event.preventDefault();const s=findActive(),ex=s&&currentExercise(s);if(!ex||busy)return;const repInput=app.querySelector('#reps'),kgInput=app.querySelector('#kg'),reps=Number(repInput.value),rawKG=kgInput?.value??'0',kg=rawKG===''&&ex.kind==='body'?0:Number(rawKG),mode=ex.kind==='body'?(app.querySelector('[data-mode].selected')?.dataset.mode||'bw'):ex.kind;
 if(!Number.isInteger(reps)||reps<1||reps>300){markError('Enter a valid number of reps.');return;}if(kgInput&&(rawKG===''&&mode!=='assisted'||!Number.isFinite(kg)||kg<0||kg>300)){markError('Enter a valid weight in kg.');return;}
 const record={reps,kg,mode,at:new Date().toISOString()};const ok=await editCurrent(x=>{if(!x.logs[ex.id])x.logs[ex.id]=[];if(x.logs[ex.id].length>=totalOf(x,ex))throw new Error('Planned sets already completed.');x.logs[ex.id].push(record);});if(ok){draft=null;app.querySelector('#reps')?.focus();}}
async function advance(){const s=findActive();if(!s)return;const last=s.index>=sessionRoutine(s).exercises.length-1;const ok=await editCurrent(x=>{if(last){x.status='finished';x.finishedAt=new Date().toISOString();}else x.index++;});if(ok){draft=null;err='';if(last){finishedSession=s.id;view='complete';}else view='workout';render();window.scrollTo(0,0);}}
function renderComplete(){app.innerHTML=`<section class="fade"><div class="eyebrow">WORKOUT SAVED TO CLOUD</div><div class="completeCard"><div class="completeIcon">✓</div><h2>All done.</h2><p>Workout completion and sets are confirmed saved online under your account.</p><button id="backHome" type="button" class="primary">Back to workouts</button><div class="extraActions"><button id="backup" type="button" class="secondary">Download separate backup</button></div></div></section>`;app.querySelector('#backHome').onclick=()=>{view='home';render();};app.querySelector('#backup').onclick=exportJson;}
function renderTools(){const sorted=[...sessions].sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt));const legacyCount=legacy?.sessions?.length||0;
 app.innerHTML=`<section class="fade"><div class="eyebrow">YOUR PRIVATE DATA</div><h1 class="big">History & backup.</h1><p class="sub">Fetched from your Supabase cloud account.</p>${statusBar()}${notice?`<div class="infoBox">${esc(notice)}</div>`:''}
 <section class="toolsSection"><h2 class="toolsTitle">Sessions (${sorted.length})</h2>${sorted.length?sorted.map(s=>{const day=sessionRoutine(s);if(!day)return '';const entries=day.exercises.map(ex=>({ex,sets:logsOf(s,ex.id)})).filter(x=>x.sets.length);return `<details class="historyCard"><summary><span><b>${esc(day.name)}</b><small>${fmtDate(s.startedAt)} · ${s.status==='finished'?'Finished':s.status==='active'?'In progress':'Partial'} · ${entries.reduce((n,x)=>n+x.sets.length,0)} sets</small></span><span class="arrow">›</span></summary><div class="historyInner">${entries.map(x=>`<div class="historyEx"><strong>${esc(x.ex.name)}</strong><div>${x.sets.map((set,i)=>`Set ${i+1}: ${esc(fmtSet(set,x.ex))}`).join('<br>')}</div></div>`).join('')||'<p class="minor">No sets logged</p>'}<button type="button" class="sessionDelete" data-delete="${esc(s.id)}">${s.status==='active'?'Discard this workout':'Delete this session'}</button></div></details>`;}).join(''):'<p class="footnote">No cloud history yet. Log a set and it will appear here.</p>'}</section>
 <div class="divider"></div><section class="toolsSection"><h2 class="toolsTitle">Independent backups</h2><div class="dataControls"><button id="export" type="button" class="secondary">Download JSON backup</button><button id="csv" type="button" class="secondary">Export CSV</button><button id="restore" type="button" class="secondary">Restore JSON backup</button>${legacyCount?`<button id="importOld" type="button" class="secondary">Import old on-device data (${legacyCount})</button>`:''}<button id="reload" type="button" class="secondary">Reload from cloud</button></div><input hidden type="file" accept=".json,application/json" id="restoreFile"><p class="footnote">Only your account can access these database records. Cloud is primary; backups stored in Files/iCloud Drive add an independent copy. Never upload a secret key to GitHub.</p></section><div class="divider"></div><section class="toolsSection"><h2 class="toolsTitle">Account</h2><p class="minor">${esc(auth?.user?.email||'Signed in')} · ${esc(config?.url||'')}</p><div class="dataControls"><button type="button" class="secondary" id="signout">Sign out</button>${!fixedConfig?'<button type="button" class="secondary" id="changeCloud">Change cloud project</button>':''}</div></section>${findActive()?'<button type="button" class="primary" id="return" style="margin-top:22px">Return to current exercise →</button>':''}</section>`;
 app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeSession(b.dataset.delete));app.querySelector('#export').onclick=exportJson;app.querySelector('#csv').onclick=exportCsv;
 app.querySelector('#restore').onclick=()=>app.querySelector('#restoreFile').click();app.querySelector('#restoreFile').onchange=restoreFile;app.querySelector('#importOld')?.addEventListener('click',()=>importData(legacy));
 app.querySelector('#reload').onclick=()=>transact(loadRemote);app.querySelector('#signout').onclick=async()=>{if(!confirm('Sign out? Your cloud workouts stay saved and will return when you sign in again.'))return;const cleared=await forgetAuth();sessions=[];activeId=null;view='auth';notice=cleared===null?"Could not confirm the local login backup was removed. Consider clearing this site's data if you share this device.":'';err='';render();};
 app.querySelector('#changeCloud')?.addEventListener('click',async()=>{if(!confirm('Change cloud project? Your current records remain in the existing project.'))return;await forgetAuth();view='setup';render();});app.querySelector('#return')?.addEventListener('click',()=>{view='workout';render();});}
async function removeSession(id){const session=sessions.find(s=>s.id===id);if(!session)return;if(!confirm('Delete this '+(sessionRoutine(session)?.name||'workout')+' session and its sets from the cloud? This is permanent unless you have a backup.'))return;
 await transact(async()=>{await deleteRemote(session);sessions=sessions.filter(s=>s.id!==id);if(activeId===id)activeId=null;});}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),12000);}
function backupObject(){return {version:2,routines:clone(routines),sessions:sessions.map(s=>({id:s.id,dayId:s.dayId,snapshot:s.snapshot,startedAt:s.startedAt,finishedAt:s.finishedAt,status:s.status,index:s.index,logs:s.logs,extraSets:s.extraSets})),activeId:activeId};}
function exportJson(){download('one-set-cloud-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(backupObject(),null,2),'application/json');}
function exportCsv(){const out=[['Date','Workout','Exercise','Set','Reps','Kg','Weight type','Status']];for(const s of sessions)for(const ex of (sessionRoutine(s)?.exercises||[]))logsOf(s,ex.id).forEach((t,i)=>out.push([s.startedAt.slice(0,10),sessionRoutine(s).name,ex.name,i+1,t.reps,t.kg,t.mode,s.status]));download('one-set-workouts-'+new Date().toISOString().slice(0,10)+'.csv',out.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv');}
function validImport(o){
 if(!o||![1,2].includes(o.version)||!Array.isArray(o.sessions)||o.sessions.length>10000)return false;
 if(o.version===2&&(!Array.isArray(o.routines)||!validRoutines(o.routines)))return false;
 return o.sessions.every(s=>{
  if(!s||typeof s.id!=='string'||s.id.length>200||typeof s.dayId!=='string'||s.dayId.length>140||typeof s.startedAt!=='string'||!['active','finished','partial'].includes(s.status)||!Number.isInteger(s.index)||s.index<0||!s.logs||typeof s.logs!=='object'||Array.isArray(s.logs))return false;
  const routine=s.snapshot||STARTER_PLAN[s.dayId];if(!routine||!Array.isArray(routine.exercises)||routine.exercises.length<1||routine.exercises.length>35||s.index>=routine.exercises.length)return false;
  if(s.snapshot&&!validRoutines([s.snapshot]))return false;
  return Object.entries(s.logs).every(([id,arr])=>routine.exercises.some(ex=>ex.id===id)&&Array.isArray(arr)&&arr.length<=25&&arr.every(t=>Number.isInteger(t.reps)&&t.reps>=1&&t.reps<=300&&Number.isFinite(t.kg)&&t.kg>=0&&t.kg<=300&&['bw','added','assisted','db','weight'].includes(t.mode)));
 });
}
async function restoreFile(e){const f=e.target.files?.[0];e.target.value='';if(!f)return;let data;try{data=JSON.parse(await f.text());}catch(_){markError('Backup is not a valid JSON file.');return;}await importData(data);}
async function importData(data){
 if(!validImport(data)){markError('Invalid One Set backup; no records were changed.');return;}
 const known=new Set(sessions.map(s=>s.id));const additions=data.sessions.filter(s=>!known.has(s.id));
 const plansAvailable=data.version===2&&data.routines.length>0;
 const restorePlans=plansAvailable&&confirm('Do you also want to REPLACE your current workout routines with those in this backup? Your cloud session history will not be deleted. Tap Cancel to keep your current routines.');
 if(!additions.length&&!restorePlans){notice='No new sessions to import. Your current routines were left alone.';render();return;}
 if(additions.length&&!confirm(`Import ${additions.length} missing session(s) into this account? Existing workout history will be preserved.`))return;
 const ok=await transact(async()=>{
  if(restorePlans)await savePlan(clone(data.routines));
  let imported=0;
  for(const s of additions){const clean={id:s.id,dayId:s.dayId,snapshot:s.snapshot||null,startedAt:s.startedAt,finishedAt:s.finishedAt||null,status:s.status==='active'?'partial':s.status,index:s.index,logs:s.logs,extraSets:s.extraSets||{},revision:1};const saved=await createRemote(clean);sessions.push(saved);imported++;}
  await loadRemote();notice=imported+' session(s) imported.'+(restorePlans?' Routines also restored.':' Your routines are unchanged.');
 });if(ok){legacy=null;view='tools';render();}
}

async function legacyFromDevice(){const local=read(OLD_KEY);if(local?.sessions?.length)return local;
 try{return await new Promise(resolve=>{if(!('indexedDB' in window)){resolve(null);return;}let once=false;const finish=v=>{if(!once){once=true;resolve(v);}};const request=indexedDB.open('oneset_on_device_backup_v1');request.onsuccess=()=>{try{if(!request.result.objectStoreNames.contains('snapshots')){finish(null);return;}const tx=request.result.transaction('snapshots','readonly');const get=tx.objectStore('snapshots').get('latest');get.onsuccess=()=>finish(get.result);get.onerror=()=>finish(null);}catch(_){finish(null);}};request.onerror=()=>finish(null);setTimeout(()=>finish(null),1500);});}catch(_){return null;}}
async function start(){legacy=await legacyFromDevice();if(config && !auth){const remembered=await loginDB('get');if(remembered?.url===config.url && remembered.auth?.access_token && remembered.auth?.user?.id){auth=remembered.auth;store(AUTH_KEY,auth);}}if(!config?.url||!config?.key){view='setup';render();return;}if(!auth?.access_token||!auth.user?.id){view='auth';render();return;}
 app.innerHTML='<p class="sub">Connecting to your cloud history…</p>';try{await loadPlan();await loadRemote();view='home';render();}catch(e){err=e.message;app.innerHTML=`<section class="authPanel"><div class="eyebrow">COULD NOT LOAD HISTORY</div><h1 class="big">Not yet connected.</h1><div class="errBox">${esc(err)}</div><p>We will not show an empty workout history when the cloud could not be reached.</p><button type="button" id="retry" class="primary">Retry connection</button><button type="button" id="logout" class="smallLink">Sign in again</button></section>`;app.querySelector('#retry').onclick=start;app.querySelector('#logout').onclick=async()=>{await forgetAuth();view='auth';render();};}}
menu.onclick=()=>{if(view==='editPlan'){view='plans';editorDraft=null;}else if(view==='plans'){view='home';}else if(view==='tools'){view=backView==='workout'&&findActive()?'workout':'home';err='';}else{backView=view==='workout'?'workout':'home';view='tools';}render();window.scrollTo(0,0);};
window.addEventListener('online',()=>{if(view==='home'||view==='tools')err='';});
start();
})();

</script></body></html>
